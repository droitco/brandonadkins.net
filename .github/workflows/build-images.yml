name: Build site images
on:
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/build-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.3.0
      - run: python .github/scripts/build_images.py /tmp/source.jpg images
      - run: sha256sum -c .github/scripts/images.sha256 && ls -l images
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898999+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Add site images (built from source photo, sha256-verified)" && git push)
